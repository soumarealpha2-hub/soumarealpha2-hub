<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Seat Academy — responsive preview review</title><style>body{margin:0;padding:24px;font:15px/1.5 Arial,sans-serif;background:#edf1f6;color:#142f4c}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:20px}h1{font-size:20px;margin:0}label{display:flex;gap:10px;align-items:center}select,a{padding:10px;color:#142f4c}iframe{display:block;background:#fff;height:900px;border:1px solid #9cacc0;max-width:100%;box-sizing:content-box}p{font-size:13px}button{min-height:40px}</style></head><body><header><h1>First Seat · Preview review</h1><label>Viewport width <select id="width"><option value="375">375px — mobile</option><option value="768">768px — tablet</option><option value="1180">1180px — desktop</option></select></label><label>Screen <select id="route"><option value="home">Home</option><option value="start">Onboarding</option><option value="start/task">First trade</option><option value="careers/consulting">Consulting careers</option><option value="learn">Learning paths</option><option value="learn/operations-markets">Beginner lesson</option><option value="operations/learning">Operations practice</option><option value="resume-match">Resume match</option><option value="my-learning">My learning</option></select></label><a href="/#home">Open the full preview ↗</a></header><p>Interact with the app below. The frame uses a real 375px layout viewport; progress saves in the same browser.</p><iframe title="First Seat responsive preview" src="/#home" style="width:375px"></iframe><script>const frame=document.querySelector('iframe');document.getElementById('width').addEventListener('change',e=>frame.style.width=e.target.value+'px');document.getElementById('route').addEventListener('change',e=>frame.src='/#'+e.target.value);</script></body></html>
