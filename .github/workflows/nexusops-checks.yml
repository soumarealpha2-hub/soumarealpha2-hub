name: NexusOps Checks

on:
  push:
    paths:
      - 'nexusops/**'
      - '.github/workflows/nexusops-checks.yml'
  pull_request:
    paths:
      - 'nexusops/**'
      - '.github/workflows/nexusops-checks.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: nexusops/requirements.txt

      - name: Install dependencies
        run: pip install -r nexusops/requirements.txt

      - name: Compile application
        run: python -m py_compile nexusops/app.py

      - name: Smoke test imports
        run: python -c "import streamlit, pandas, numpy, plotly; print('NexusOps dependencies OK')"
