name: Portfolio tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r delivery-ops-analytics/requirements.txt
      - name: Run project tests
        run: pytest delivery-ops-analytics/tests cre-underwriting-model/tests
